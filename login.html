<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign in — Digital Experience</title>
<meta name="robots" content="noindex, nofollow, noarchive" />
<style>
  :root{
    color-scheme: light;
    --ink:#1d1d1f; --muted:#55555c; --faint:#86868b;
    --bg:#ececed;
    --glass:255,255,255; --glass-a:.62;
    --edge:rgba(255,255,255,.70); --edge-out:rgba(0,0,0,.08); --hi:rgba(255,255,255,.90);
    --fill:rgba(120,120,128,.10); --fill-2:rgba(120,120,128,.16);
    --blue:#0071e3; --red:#c1362c;
    --b1:rgba(0,122,255,.30); --b2:rgba(255,45,85,.18);
    --b3:rgba(90,200,250,.30); --b4:rgba(175,82,222,.20);
    --shadow-l:0 1px 2px rgba(0,0,0,.06), 0 22px 60px -18px rgba(0,0,0,.28);
    --ease:cubic-bezier(.32,.72,0,1);
    --ease-soft:cubic-bezier(.2,.8,.2,1);
    --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Inter,system-ui,sans-serif;
    --text:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,system-ui,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      color-scheme: dark;
      --ink:#f5f5f7; --muted:#a8a8ae; --faint:#8b8b91;
      --bg:#08080a;
      --glass:36,36,40; --glass-a:.58;
      --edge:rgba(255,255,255,.14); --edge-out:rgba(0,0,0,.55); --hi:rgba(255,255,255,.16);
      --fill:rgba(120,120,128,.22); --fill-2:rgba(120,120,128,.34);
      --blue:#0a84ff; --red:#ff6b5e;
      --b1:rgba(10,132,255,.34); --b2:rgba(255,55,95,.20);
      --b3:rgba(64,200,224,.26); --b4:rgba(191,90,242,.26);
      --shadow-l:0 1px 2px rgba(0,0,0,.5), 0 26px 64px -18px rgba(0,0,0,.85);
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
    background:var(--bg); color:var(--ink);
    font:400 15px/1.55 var(--text); letter-spacing:-.011em; -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:""; position:fixed; inset:-25%; z-index:-2; pointer-events:none;
    background:
      radial-gradient(38% 42% at 10% 6%,  var(--b1), transparent 68%),
      radial-gradient(34% 36% at 90% 2%,  var(--b2), transparent 68%),
      radial-gradient(44% 48% at 82% 68%, var(--b3), transparent 68%),
      radial-gradient(38% 42% at 14% 92%, var(--b4), transparent 68%);
    filter:blur(70px) saturate(150%);
  }

  .card{
    width:100%; max-width:392px; border-radius:28px; padding:34px 30px 28px;
    background:rgba(var(--glass),var(--glass-a));
    -webkit-backdrop-filter:blur(32px) saturate(190%);
    backdrop-filter:blur(32px) saturate(190%);
    border:.5px solid var(--edge-out);
    box-shadow:inset 0 .5px 0 var(--hi), inset .5px 0 0 var(--edge), inset -.5px 0 0 var(--edge), var(--shadow-l);
  }
  .mark{
    width:46px; height:46px; border-radius:14px; margin:0 auto 18px; display:grid; place-items:center;
    background:linear-gradient(180deg, color-mix(in srgb,var(--blue) 88%, #fff), var(--blue));
    box-shadow:inset 0 .5px 0 rgba(255,255,255,.5), 0 6px 18px -8px color-mix(in srgb,var(--blue) 70%,transparent);
  }
  .mark svg{width:22px; height:22px; color:#fff}
  h1{margin:0 0 6px; text-align:center; font-family:var(--display); font-size:22px; font-weight:600; letter-spacing:-.03em}
  .sub{margin:0 0 24px; text-align:center; font-size:13.5px; color:var(--faint)}

  label{display:block; margin-bottom:14px}
  .lab{display:block; font:500 11.5px/1 var(--text); letter-spacing:.02em; color:var(--muted); margin-bottom:7px}
  input{
    width:100%; height:38px; padding:0 13px; border-radius:11px; font:400 14.5px var(--text); color:var(--ink);
    background:var(--fill); border:.5px solid transparent;
    box-shadow:inset 0 .5px 0 var(--hi); transition:.2s var(--ease-soft);
  }
  input::placeholder{color:var(--faint)}
  input:focus{
    outline:none; background:rgba(var(--glass),.92);
    border-color:color-mix(in srgb,var(--blue) 60%,transparent);
    box-shadow:inset 0 .5px 0 var(--hi), 0 0 0 3.5px color-mix(in srgb,var(--blue) 22%,transparent);
  }
  input[aria-invalid="true"]{border-color:color-mix(in srgb,var(--red) 65%,transparent)}

  button{
    width:100%; height:38px; margin-top:6px; border:0; border-radius:11px; cursor:pointer;
    font:500 14.5px var(--text); color:#fff;
    background:linear-gradient(180deg, color-mix(in srgb,var(--blue) 92%, #fff), var(--blue));
    box-shadow:inset 0 .5px 0 rgba(255,255,255,.45), 0 1px 2px rgba(0,0,0,.12), 0 6px 18px -8px color-mix(in srgb,var(--blue) 70%,transparent);
    transition:transform .18s var(--ease), filter .2s var(--ease-soft), opacity .2s var(--ease-soft);
  }
  button:hover:not(:disabled){filter:brightness(1.07)}
  button:active:not(:disabled){transform:scale(.98)}
  button:disabled{opacity:.6; cursor:default}

  .err{
    display:none; margin:14px 0 0; padding:10px 12px; border-radius:11px; font-size:13px; line-height:1.45;
    color:var(--red); background:color-mix(in srgb,var(--red) 11%,transparent);
    border:.5px solid color-mix(in srgb,var(--red) 28%,transparent);
  }
  .err.on{display:block}
  .foot{margin:20px 0 0; text-align:center; font-size:12px; line-height:1.5; color:var(--faint)}
  :focus-visible{outline:3px solid color-mix(in srgb,var(--blue) 55%,transparent); outline-offset:2px}
  @media (prefers-reduced-transparency:reduce){
    .card{background:var(--bg); -webkit-backdrop-filter:none; backdrop-filter:none}
    body::before{display:none}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none"><rect x="4" y="10.5" width="16" height="10" rx="3" stroke="currentColor" stroke-width="1.9"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
    </div>
    <h1>Digital Experience</h1>
    <p class="sub">Internal index. Sign in to continue.</p>

    <form id="f" novalidate>
      <label>
        <span class="lab">S5 email</span>
        <input id="email" name="email" type="email" inputmode="email" autocomplete="username"
               placeholder="you@s5tech.co" required autofocus />
      </label>
      <label>
        <span class="lab">Password</span>
        <input id="password" name="password" type="password" autocomplete="current-password"
               placeholder="••••••••••" required />
      </label>
      <button id="go" type="submit">Sign in</button>
      <p class="err" id="err" role="alert" aria-live="polite"></p>
    </form>

    <p class="foot">Access is limited to <b>@s5tech.co</b> addresses.<br />Sessions last 12 hours.</p>
  </main>

<script>
(function(){
  var f=document.getElementById('f'), go=document.getElementById('go'), err=document.getElementById('err');
  var email=document.getElementById('email'), password=document.getElementById('password');

  function fail(msg, which){
    err.textContent=msg; err.classList.add('on');
    (which||password).setAttribute('aria-invalid','true');
    go.disabled=false; go.textContent='Sign in';
  }
  function clear(){
    err.classList.remove('on');
    email.removeAttribute('aria-invalid'); password.removeAttribute('aria-invalid');
  }
  email.addEventListener('input',clear); password.addEventListener('input',clear);

  f.addEventListener('submit',async function(e){
    e.preventDefault(); clear();

    var em=email.value.trim().toLowerCase(), pw=password.value;
    if(!em || !pw) return fail('Enter your email and password.', em?password:email);
    if(!em.endsWith('@s5tech.co')) return fail('Use your @s5tech.co email address.', email);

    go.disabled=true; go.textContent='Signing in…';
    try{
      var r=await fetch('/api/login',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({email:em,password:pw})
      });
      if(r.ok){ location.replace('/'); return; }
      var d={}; try{ d=await r.json() }catch(_){}
      fail(d.error || 'Sign-in failed. Try again.');
    }catch(_){
      fail('Could not reach the server. Check your connection.');
    }
  });
})();
</script>
</body>
</html>
